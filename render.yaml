services:
  - type: web
    name: pabandi
    env: docker
    region: oregon
    plan: starter
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    buildCommand: echo "Build handled by Dockerfile"
    preDeployCommand: node scripts/ensure-agent-tables.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: CLIENT_URL
        value: https://pabandi.onrender.com
      - key: FRONTEND_URL
        value: https://pabandi.onrender.com
      - key: API_URL
        value: https://pabandi.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pabandi-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: pabandi-db
          property: connectionString
      - key: COURTLISTENER_API_KEY
        generateValue: true
      - key: COURTLISTENER_API_KEYS
        value: ""
      # x402 settlement. sync:false keeps whatever is set in the Render dashboard.
      - key: PABANDI_PAYOUT_ADDRESS
        sync: false
      - key: X402_FACILITATOR_URL
        value: https://x402.org/facilitator
      # Leave unset in production. Only set to "true" to accept unpaid calls locally.
      - key: X402_ALLOW_UNVERIFIED
        sync: false
      # Starter $PAB granted to a newly registered agent principal (0 = must be funded).
      - key: AGENT_SIGNUP_PAB_GRANT
        value: "0"
