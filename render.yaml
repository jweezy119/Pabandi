services:
  - type: web
    name: pabandi
    env: docker
    region: oregon
    plan: starter
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    buildCommand: echo "Build handled by Dockerfile"
    # NB: preDeploy runs from the repo root, not /app/server.
    # NB: preDeploy runs from the repo root, not /app/server.
    #
    # `prisma migrate deploy` runs BEFORE ensure-agent-tables.cjs, and the order
    # matters. autoDeploy is on, so a commit that adds a column ships
    # immediately — and code that reads that column fails on requests that touch
    # the affected tables until the schema catches up. That is not hypothetical:
    # the rail-retry work shipped reading ReconciliationMatch.retryCount and
    # settlementStatus, and InvoiceTrustEvent's nullable scopes, all applied by
    # migrations rather than by the deploy itself.
    #
    # Safe to add now, and only now, because it is verified that this service's
    # DATABASE_URL points at the database that `prisma migrate deploy` was
    # actually being run against — see the DATABASE_URL note below. Had that
    # been a Render database instead, this command would have attempted all 43
    # migrations against a database that has never had them run.
    #
    # `migrate deploy` applies only unapplied migrations, each in a
    # transaction, so a bad migration fails the deploy rather than leaving the
    # schema half-moved. Deliberately NOT `migrate dev` or `db push`: both can
    # drop tables, and `db push` would reconcile against the 67-statement
    # divergence between schema.prisma and this database.
    preDeployCommand: cd server && npx prisma migrate deploy && node scripts/ensure-agent-tables.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # The SPA, not this service. These pointed at the API origin, which serves
      # the built app as well — so every OAuth callback redirected to
      # https://pabandi.onrender.com/auth/callback, the session was written into
      # that origin's localStorage, and the user was signed out again the moment
      # they used pabandi.com. The OAuth routes now take the origin from the
      # client instead (utils/oauthRedirect.ts), so this is defence in depth.
      - key: CLIENT_URL
        value: https://pabandi.com
      - key: FRONTEND_URL
        value: https://pabandi.com
      - key: API_URL
        value: https://pabandi.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # THE LIVE SERVICE DOES NOT USE A RENDER DATABASE. It connects to Aliyun RDS.
      #
      # This entry previously read `fromDatabase: { name: pabandi-db }`, which
      # was wrong and actively dangerous: `fromDatabase` makes the blueprint
      # authoritative, so any re-apply of this file would point the service at a
      # Render-managed Postgres instead of the database it actually reads. That
      # would not be a slow degradation — the new database has none of the 338
      # tables, so every authenticated request would fail at once.
      #
      # How this was established rather than assumed: `schema-check.service`
      # added in 8fa0ddd8f reports on /health whether the columns the running
      # code queries exist. The deployed service returns `schema.ok: true`,
      # including for `InvoiceTrustEvent.invoiceId` being NULLABLE — a property
      # that became true only on Aliyun RDS, when migration
      # 20261010_trust_event_null_scope ran there on 2026-10-11. A Render
      # database would have returned false.
      #
# `sync: false` keeps the dashboard value, so the working configuration
      # cannot be silently overwritten. If the database is ever genuinely moved,
      # change it in the dashboard and update this comment — do not restore a
      # fromDatabase block without verifying which database the service reads.
      #
      # ACTION REQUIRED IN THE RENDER DASHBOARD (cannot be done from this file,
      # because sync:false means the blueprint does not own this value):
      # append `&connection_limit=10&pool_timeout=20` to the existing URL. The
      # repo's .env / .env.production / .env.example already carry it; this
      # dashboard value has not been changed. The worker service added in a
      # later phase opens its own pool, so 10 (api) + 10 (worker) = 20 against
      # Aliyun RDS — check max_connections before raising either.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        fromDatabase:
          name: pabandi-db
          property: connectionString
      - key: COURTLISTENER_API_KEY
        generateValue: true
      - key: COURTLISTENER_API_KEYS
        value: ""
      # Required in production: every PTP attestation (issue + verify) is signed
      # with it, and protocol/ptp.spec.ts throws at import time without it, which
      # takes down every route that touches trust.
      - key: PTP_SIGNING_SECRET
        sync: false
      # 64-char hex. Required by utils/encryption.ts for wallet secrets.
      - key: ENCRYPTION_KEY
        sync: false
      # x402 settlement. sync:false keeps whatever is set in the Render dashboard.
      - key: PABANDI_PAYOUT_ADDRESS
        sync: false
      - key: X402_FACILITATOR_URL
        value: https://x402.org/facilitator
      # Leave unset in production. Only set to "true" to accept unpaid calls locally.
      - key: X402_ALLOW_UNVERIFIED
        sync: false
      # Starter $PAB granted to a newly registered agent principal (0 = must be funded).
      - key: AGENT_SIGNUP_PAB_GRANT
        value: "0"
      # Canonical $PAB mint (name "Pabandi", symbol "PAB"). Set explicitly so the
      # service never falls back to a hardcoded default. sync:false means the
      # dashboard value wins; the code default in config/pabToken.ts is the same mint.
      - key: PAB_MINT_ADDRESS
        sync: false
      # Solana RPC. mainnet-beta is public and rate-limited; a paid RPC is
      # recommended for real traffic.
      - key: SOLANA_RPC_URL
        value: https://api.mainnet-beta.solana.com
