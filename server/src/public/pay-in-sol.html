<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pabandi — Pay in SOL to Book an Agent</title>
<script src="https://unpkg.com/@solana/web3.js@1.95.3/lib/index.iife.min.js"></script>
<style>
  :root{ --bg:#0b0e14; --card:#121722; --accent:#7c5cff; --text:#e7ecf3; --muted:#8b95a7; --ok:#2ecc71; --err:#ff6b6b; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(1200px 600px at 70% -10%,#1a2138 0%,var(--bg) 60%);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:var(--card);border:1px solid #222b3d;border-radius:18px;padding:28px;max-width:460px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.45)}
  h1{font-size:22px;margin:0 0 4px;letter-spacing:.2px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:20px}
  label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px}
  input,select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid #2a3447;background:#0c111b;color:var(--text);font-size:14px;outline:none}
  input:focus,select:focus{border-color:var(--accent)}
  .fee{font-size:12px;color:var(--muted);margin-top:6px}
  button{margin-top:18px;width:100%;padding:13px;border:none;border-radius:11px;background:linear-gradient(135deg,#7c5cff,#5a8bff);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:transform .08s ease}
  button:active{transform:scale(.985)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .status{margin-top:16px;font-size:13px;padding:12px;border-radius:10px;background:#0c111b;border:1px solid #222b3d;min-height:20px;white-space:pre-wrap;word-break:break-all}
  .ok{color:var(--ok)} .err{color:var(--err)} .mut{color:var(--muted)}
  .pill{display:inline-block;background:#1b2333;border:1px solid #2a3447;border-radius:999px;padding:3px 10px;font-size:11px;color:var(--muted);margin-bottom:14px}
  a{color:var(--accent);text-decoration:none}
  .row{display:flex;gap:8px;align-items:center}
</style>
</head>
<body>
<div class="card">
  <div class="pill">SOLANA · autonomous agent economy</div>
  <h1>Book an AI Agent — Pay in SOL</h1>
  <div class="sub">Real on-chain payment. 1% platform rake, rest settles the agent. No card, no fiat.</div>

  <label>Agent / Service</label>
  <select id="agent">
    <option value="agent:dev-001">Freelance Dev Agent — 0.05 SOL</option>
    <option value="agent:biz-002">Small-Biz Ops Agent — 0.1 SOL</option>
    <option value="agent:proj-003">Project Manager Agent — 0.2 SOL</option>
  </select>

  <label>Amount (SOL)</label>
  <input id="amount" type="number" step="0.001" min="0.001" value="0.05" />

  <div class="fee" id="feeNote">Platform rake (1%): 0.0005 SOL · You send total: 0.0505 SOL</div>

  <button id="pay">Connect Wallet &amp; Pay in SOL</button>
  <div class="status mut" id="status">Idle. Connect a Solana wallet (Phantom) or paste a base58 key to pay.</div>
</div>

<script>
const API = 'https://pabandi.onrender.com/api/v1/economy';
const RPC = 'https://mainnet.helius-rpc.com/?api-key=3caa4d83-82b5-4e35-a377-799a0eb1082c';
const { Connection, Transaction, PublicKey, LAMPORTS_PER_SOL } = solanaWeb3;
const conn = new Connection(RPC, 'confirmed');

const $ = id => document.getElementById(id);
function setStatus(msg, cls){ $('status').className = 'status ' + (cls||'mut'); $('status').textContent = msg; }

// Deep-link support: /pay-in-sol.html#amount=0.1&agent=agent:dev-001
(function applyHash(){
  const h = location.hash.replace(/^#/, '');
  const p = new URLSearchParams(h);
  if (p.get('amount')) $('amount').value = p.get('amount');
  if (p.get('agent')) $('agent').value = p.get('agent');
  updateFee();
})();

$('amount').addEventListener('input', updateFee);
$('agent').addEventListener('change', updateFee);
function updateFee(){
  const amt = parseFloat($('amount').value||'0');
  const rake = (amt*0.01);
  $('feeNote').textContent = `Platform rake (1%): ${rake.toFixed(6)} SOL · You send total: ${(amt+rake).toFixed(6)} SOL`;
}

$('pay').addEventListener('click', pay);

async function pay(){
  $('pay').disabled = true;
  try {
    const solAmount = parseFloat($('amount').value);
    const agentId = $('agent').value;
    if (!(solAmount > 0)) throw new Error('Enter a valid SOL amount');

    // 1) get the payer pubkey
    let payerPub;
    if (window.solana && window.solana.isPhantom) {
      await window.solana.connect();
      payerPub = window.solana.publicKey.toString();
    } else {
      const k = prompt('No Phantom detected. Paste your base58 private key to sign (demo only):');
      if (!k) throw new Error('Cancelled');
      const { Keypair } = solanaWeb3;
      const bs58 = await import('https://esm.run/bs58');
      const kp = Keypair.fromSecretKey(bs58.default.decode(k));
      payerPub = kp.publicKey.toString();
      window.__kp = kp;
    }
    setStatus('Wallet: ' + payerPub.slice(0,8) + '…\nRequesting SOL checkout…');

    // 2) request the charge-rake tx from the server
    const r = await fetch(API + '/sol-checkout', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ payer: payerPub, solAmount, agentId, note:'demo SOL booking' })
    });
    const j = await r.json();
    if (!j.success) throw new Error(j.error || 'sol-checkout failed');
    const { serializedTx, bookingRef, rakeSol } = j.data;
    setStatus('Checkout ready.\nRake: ' + rakeSol + ' SOL\nBroadcasting transaction…');

    // 3) sign + broadcast
    const tx = Transaction.from(Buffer.from(serializedTx, 'base64'));
    let sig;
    if (window.solana && window.solana.isPhantom) {
      sig = await window.solana.signAndSendTransaction(tx);
      sig = sig.signature;
    } else {
      tx.partialSign(window.__kp);
      sig = await conn.sendRawTransaction(tx.serialize(), { skipPreflight:false });
    }
    await conn.confirmTransaction(sig, 'confirmed');
    setStatus('Tx broadcast: ' + sig.slice(0,12) + '…\nConfirming revenue on server…', 'ok');

    // 4) confirm rake (records platform revenue)
    const c = await fetch(API + '/confirm-rake', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ bookingRef, txHash: sig })
    });
    const cj = await c.json();
    if (cj.success && cj.data.confirmed) {
      setStatus('✅ Booking paid on-chain.\nPlatform rake collected: ' + cj.data.rakeSol + ' SOL\nTx: ' + sig, 'ok');
    } else {
      setStatus('Paid on-chain but server confirm pending.\nTx: ' + sig, 'mut');
    }
  } catch (e) {
    setStatus('Error: ' + e.message, 'err');
  } finally {
    $('pay').disabled = false;
  }
}
</script>
</body>
</html>
