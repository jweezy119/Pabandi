<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pabandi Widget</title>
  <style>
    :root {
      --bg: #0f0f17;
      --card: rgba(20, 20, 35, 0.85);
      --border: rgba(255,255,255,0.08);
      --text: #e7e7ea;
      --muted: #9a9aaa;
      --accent: #6366f1;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background: linear-gradient(135deg, #0f0f17 0%, #13132a 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      padding: 24px;
    }
    .widget {
      width: 100%;
      max-width: 420px;
      border: 1px solid var(--border);
      background: var(--card);
      backdrop-filter: blur(20px);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.45);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .brand-mark {
      width: 32px; height: 32px; border-radius: 10px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      display: grid; place-items: center; font-weight: 800; color: white;
    }
    .brand-name { font-weight: 700; letter-spacing: 0.2px; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
    }
    .pill input {
      background: transparent;
      border: 0;
      color: var(--text);
      outline: none;
      min-width: 180px;
      font-size: 13px;
    }
    .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .result {
      margin-top: 14px;
      border-top: 1px solid var(--border);
      padding-top: 12px;
      max-height: 220px;
      overflow: auto;
    }
    .item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 8px;
      background: rgba(255,255,255,0.02);
    }
    .item-name { font-weight: 600; font-size: 13px; }
    .item-meta { color: var(--muted); font-size: 12px; }
    .empty { color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <div class="widget" id="pabandi-widget">
    <div class="brand">
      <div class="brand-mark">P</div>
      <div class="brand-name">Pabandi Widget</div>
    </div>
    <div class="row">
      <button class="pill" onclick="run('search')">🔎 Search</button>
      <button class="pill" onclick="run('trust')">🛡️ Trust</button>
      <button class="pill" onclick="run('predict')">📈 Predict</button>
    </div>
    <div class="row">
      <input id="q" class="pill" placeholder="Query, user id, or category…" />
    </div>
    <div class="result" id="out"><div class="empty">Run a tool to see results.</div></div>
  </div>

  <script>
    const BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
      ? 'http://localhost:4000'
      : 'https://pabandi.onrender.com';
    const APP_ID = new URLSearchParams(location.search).get('appId') || 'widget';
    const MODE = new URLSearchParams(location.search).get('mode') || 'search';

    async function run(mode) {
      const q = document.getElementById('q').value || '';
      const out = document.getElementById('out');
      out.innerHTML = '<div class="empty">Loading…</div>';
      try {
        let result;
        if (mode === 'search') {
          const r = await fetch(`${BASE}/api/v1/businesses?search=${encodeURIComponent(q)}&limit=8`);
          result = await r.json();
        } else if (mode === 'trust') {
          const r = await fetch(`${BASE}/api/v1/trust/public/${encodeURIComponent(q || 'demo')}`);
          result = await r.json();
        } else {
          result = { ok: true, note: `predict mode=${q || 'demo'} — call /api/v1/predictive/booking from server` };
        }
        if (!result || !result.data) throw new Error('Empty response');
        const items = Array.isArray(result.data) ? result.data : [result.data];
        out.innerHTML = items.slice(0, 8).map((it) => `
          <div class="item">
            <div>
              <div class="item-name">${it.name || it.profileId || it.userId || 'Result'}</div>
              <div class="item-meta">${[it.category, it.city, it.trustScore, it.completionRate].filter(Boolean).join(' · ') || '—'}</div>
            </div>
            <div style="text-align:right">
              <div style="font-weight:700;font-size:13px">${it.balancePab ?? it.score ?? '—'}</div>
              <div class="item-meta">${it.walletAddress ? String(it.walletAddress).slice(0,6)+'…' : ''}</div>
            </div>
          </div>
        `).join('');
      } catch (e: any) {
        out.innerHTML = `<div class="empty">Error: ${e.message}</div>`;
      }
    }
  </script>
</body>
</html>
