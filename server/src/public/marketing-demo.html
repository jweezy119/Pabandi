<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pabandi — Marketing Agent Demo</title>
<style>
  :root{ --bg:#0b0e14; --card:#121722; --accent:#7c5cff; --text:#e7ecf3; --muted:#8b95a7; --ok:#2ecc71; }
  *{box-sizing:border-box}
  body{margin:0;font-family:ui-monospace,Menlo,Consolas,monospace;background:radial-gradient(1200px 600px at 70% -10%,#1a2138 0%,var(--bg) 60%);color:var(--text);min-height:100vh;padding:24px}
  .wrap{max-width:820px;margin:0 auto}
  h1{font-size:20px;margin:0 0 4px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .sub{color:var(--muted);font-size:13px;margin-bottom:16px;font-family:-apple-system,sans-serif}
  .pill{display:inline-block;background:#1b2333;border:1px solid #2a3447;border-radius:999px;padding:3px 10px;font-size:11px;color:var(--muted);margin-bottom:14px}
  .actions{display:flex;gap:10px;margin-bottom:16px;font-family:-apple-system,sans-serif}
  button{background:linear-gradient(135deg,#7c5cff,#5a8bff);color:#fff;border:none;padding:10px 16px;border-radius:10px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:not-allowed}
  .row{border:1px solid #222b3d;border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--card);font-size:12.5px;line-height:1.5}
  .tag{display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:.5px;padding:2px 7px;border-radius:6px;margin-right:8px}
  .tag.post{background:#1e2d4d;color:#7c5cff}
  .tag.engage{background:#1e3a2d;color:var(--ok)}
  .cmd{color:#9fb0c9;white-space:pre-wrap;word-break:break-all;margin-top:6px}
  .meta{color:var(--muted);font-size:11px;margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
  <div class="pill">SOLANA · autonomous marketing agent · DEMO (no creds, $0)</div>
  <h1>Marketing Agent — Live Demo</h1>
  <div class="sub">Runs the exact compose → engage pipeline that goes live on X + Farcaster. Watch it "post" + "engage" against a sample feed, writing to a local transcript.</div>
  <div class="actions"><button id="run">Run pipeline</button><button id="clear">Clear log</button></div>
  <div id="out"><div class="meta">Click "Run pipeline" to see the agent work.</div></div>
</div>
<script>
const API='https://pabandi.onrender.com/api/v1/marketing';
async function run(){
  document.getElementById('run').disabled=true;
  try{
    const r=await fetch(API+'/demo',{method:'POST'}).then(x=>x.json());
    const t=r.data.transcript||[];
    let html='';
    for(const e of t){
      if(e.type==='POST'){
        html+=`<div class="row"><span class="tag post">POST</span> agent published:<br>${e.text}<div class="cmd">X: ${e.xCmd}<br>FC: ${e.fcCmd}</div></div>`;
      } else if(e.type==='ENGAGE'){
        for(const d of e.decisions){
          html+=`<div class="row"><span class="tag engage">ENGAGE</span> ${d.kind} on "${d.matched}"<div class="cmd">X: ${d.xCmd}<br>FC: ${d.fcCmd}</div></div>`;
        }
      }
    }
    document.getElementById('out').innerHTML=html||'<div class="meta">No output.</div>';
  }catch(err){ document.getElementById('out').innerHTML='<div class="meta">Error: '+err.message+'</div>'; }
  document.getElementById('run').disabled=false;
}
document.getElementById('run').onclick=run;
document.getElementById('clear').onclick=()=>{document.getElementById('out').innerHTML='<div class="meta">Cleared.</div>';};
</script>
</body>
</html>
