<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: #F5EFE6;
      color: #2A2520;
      margin: 0;
      padding: 40px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #FFFFFF;
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 4px 12px rgba(42, 37, 32, 0.05);
    }
    .header {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #C97B5A;
      text-decoration: none;
    }
    .content {
      line-height: 1.6;
    }
    .btn {
      display: inline-block;
      background: #C97B5A;
      color: #FFFFFF;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: bold;
      margin-top: 16px;
    }
    .footer {
      text-align: center;
      margin-top: 40px;
      font-size: 12px;
      color: #BFB3A3;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <span class="logo">◈ Pabandi</span>
    </div>
    <div class="content">
      {{content}}
    </div>
  </div>
  <div class="footer">
    Powered by PabandiOS &bull; The Trust Operating System
  </div>
</body>
</html>
