<h2>Booking Confirmed</h2>
<p>Hi {{clientName}},</p>
<p>Your reservation at <strong>{{businessName}}</strong> is confirmed.</p>
<div style="background: #F5EFE6; border-radius: 12px; padding: 20px; margin: 20px 0;">
  <p><strong>Confirmation Code:</strong> {{confirmationCode}}</p>
  <p><strong>Date:</strong> {{date}}</p>
  <p><strong>Time:</strong> {{time}}</p>
  <p><strong>Guests:</strong> {{guests}}</p>
</div>
<p style="color: #BFB3A3; font-size: 14px;">We look forward to seeing you. Present this confirmation at the venue entrance.</p>
