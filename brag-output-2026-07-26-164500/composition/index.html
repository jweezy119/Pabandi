<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: 'Plus Jakarta Sans';
        src: local('Plus Jakarta Sans'), local('PlusJakartaSans-Regular');
        font-weight: 400;
      }
      @font-face {
        font-family: 'Plus Jakarta Sans';
        src: local('Plus Jakarta Sans Bold'), local('PlusJakartaSans-Bold');
        font-weight: 600;
      }
      @font-face {
        font-family: 'Outfit';
        src: local('Outfit'), local('Outfit-Regular');
        font-weight: 400;
      }
      @font-face {
        font-family: 'Outfit';
        src: local('Outfit Bold'), local('Outfit-Bold');
        font-weight: 700;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #02040a;
        color: #e8edf2;
      }
      .font-outfit { font-family: "Outfit", sans-serif; }
      .font-jakarta { font-family: "Plus Jakarta Sans", sans-serif; }
      
      .clip {
        position: absolute;
        inset: 0;
      }

      .glass-panel {
        background: rgba(8, 14, 23, 0.4);
        border: 1px solid rgba(0, 240, 255, 0.1);
        box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 0 15px rgba(0, 240, 255, 0.05);
        border-radius: 24px;
        padding: 40px;
        position: relative;
        overflow: hidden;
      }
      .glass-panel::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, transparent 100%);
        pointer-events: none;
      }
      
      .text-glow-cyan {
        text-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
      }
      .text-glow-purple {
        text-shadow: 0 0 20px rgba(168, 85, 247, 0.6);
      }

      .scene-inner {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Scene 1: Hook */
      #hook-text {
        font-size: 120px;
        font-weight: 700;
        letter-spacing: -2px;
      }
      #cursor {
        display: inline-block;
        width: 60px;
        height: 120px;
        background-color: #00f0ff;
        box-shadow: 0 0 20px rgba(0, 240, 255, 0.8);
        margin-left: 20px;
        vertical-align: middle;
      }

      /* Scene 2 & 3: Chat Interface */
      #chat-scene-inner {
        gap: 100px;
      }
      #chat-wrapper {
        width: 600px;
        height: 800px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: 20px;
      }
      .chat-bubble {
        padding: 24px;
        border-radius: 20px;
        font-size: 28px;
        line-height: 1.5;
        max-width: 85%;
        opacity: 0; /* Animated in by GSAP */
      }
      .bubble-bot {
        background: rgba(30, 41, 59, 0.8);
        border: 1px solid rgba(255,255,255,0.1);
        align-self: flex-start;
        border-bottom-left-radius: 4px;
      }
      .bubble-user {
        background: #00f0ff;
        color: #030712;
        font-weight: 600;
        align-self: flex-end;
        border-bottom-right-radius: 4px;
        box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
      }
      
      #terminal-text {
        font-size: 90px;
        font-weight: 700;
        line-height: 1.1;
        width: 600px;
      }

      /* Scene 4: Flex */
      #flex-scene-inner {
        flex-direction: column;
      }
      #stat-number {
        font-size: 180px;
        font-weight: 700;
        color: #00f0ff;
      }
      #stat-label {
        font-size: 48px;
        color: #a855f7;
        margin-top: -20px;
      }
      #stat-sub {
        font-size: 32px;
        color: #94a3b8;
        margin-top: 40px;
      }

      /* Scene 5: Outro */
      #outro-scene-inner {
        flex-direction: column;
      }
      #logo-text {
        font-size: 140px;
        font-weight: 700;
        letter-spacing: -3px;
        color: #fff;
      }
      #url-text {
        font-size: 40px;
        color: #00f0ff;
        letter-spacing: 4px;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20"
      data-width="1920"
      data-height="1080"
    >
      <audio id="bgm" data-start="0" data-track-index="10" data-volume="1" src="assets/music/happy-beats-business-moves-vol-12-by-ende-dot-app.mp3"></audio>

      <!-- Hook (0 - 4s) -->
      <div id="hook-scene" class="clip" data-start="0" data-duration="4" data-track-index="1">
        <div id="hook-scene-inner" class="scene-inner">
          <div id="hook-text" class="font-outfit text-glow-cyan">Dashboards are dead.<span id="cursor"></span></div>
        </div>
      </div>

      <!-- Reveal & Flow (4s - 14s) -->
      <div id="chat-scene" class="clip" data-start="4" data-duration="10" data-track-index="2">
        <div id="chat-scene-inner" class="scene-inner">
          <div id="terminal-text" class="font-outfit">Meet the<br/><span style="color:#00f0ff">Zero-UI</span><br/>Terminal.</div>
          
          <div id="chat-wrapper" class="glass-panel font-jakarta">
            <div id="msg1" class="chat-bubble bubble-bot">
              <span style="color:#a855f7; font-weight: 700;">🚨 New Trade Request 🚨</span><br/><br/>
              Send: <strong style="color:#fff">50,000 PKR</strong><br/>
              Reward: <strong style="color:#00f0ff">$185 USDC</strong>
            </div>
            <div id="msg2" class="chat-bubble bubble-user">
              ACCEPT
            </div>
            <div id="msg3" class="chat-bubble bubble-bot" style="background: rgba(20, 241, 149, 0.1); border-color: rgba(20, 241, 149, 0.3);">
              ✅ <strong style="color:#14f195">Settled instantly.</strong>
            </div>
          </div>
        </div>
      </div>

      <!-- Flex (14 - 17s) -->
      <div id="flex-scene" class="clip" data-start="14" data-duration="3" data-track-index="3">
        <div id="flex-scene-inner" class="scene-inner">
          <div id="stat-number" class="font-outfit text-glow-cyan">$500k+</div>
          <div id="stat-label" class="font-outfit text-glow-purple">Settled over Chat</div>
          <div id="stat-sub" class="font-jakarta">Instant SLA enforcement. Built-in Mudarabah yield.</div>
        </div>
      </div>

      <!-- Outro (17 - 20s) -->
      <div id="outro-scene" class="clip" data-start="17" data-duration="3" data-track-index="4">
        <div id="outro-scene-inner" class="scene-inner">
          <div id="logo-text" class="font-outfit">Pabandi</div>
          <div id="url-text" class="font-jakarta">pabandi.com</div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // -- Scene 1: Hook --
      // Cursor blink
      tl.to("#cursor", { opacity: 0, duration: 0.1, repeat: 10, yoyo: true, ease: "steps(1)" }, 0);
      tl.from("#hook-text", { opacity: 0, duration: 0.1 }, 1.2); // text appears
      // Cut-the-curve exit at 3.5s
      tl.to("#hook-text", { x: -2000, scale: 0.9, duration: 0.6, ease: "power4.inOut" }, 3.4);
      tl.set("#hook-scene-inner", { opacity: 0 }, 4.0);

      // -- Scene 2 & 3: Chat --
      // Enter at 4s
      tl.from("#terminal-text", { opacity: 0, x: -100, duration: 0.8, ease: "power3.out" }, 4.2);
      tl.from("#chat-wrapper", { opacity: 0, y: 100, duration: 0.8, ease: "power3.out" }, 4.4);
      
      // Flow messages
      tl.fromTo("#msg1", { opacity: 0, y: 20, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.5)" }, 6.0); // beat-locked
      tl.fromTo("#msg2", { opacity: 0, y: 20, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.5)" }, 8.5); // beat-locked
      tl.fromTo("#msg3", { opacity: 0, y: 20, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.5)" }, 10.5); // beat-locked

      // Exit at 13.5
      tl.to("#chat-scene-inner", { opacity: 0, y: -100, duration: 0.5, ease: "power3.in" }, 13.5);
      tl.set("#chat-scene-inner", { opacity: 0 }, 14.0);

      // -- Scene 4: Flex --
      tl.from("#stat-number", { opacity: 0, scale: 0.5, duration: 0.8, ease: "back.out(1.2)" }, 14.2); // beat-locked
      tl.from("#stat-label", { opacity: 0, y: 20, duration: 0.5, ease: "power2.out" }, 14.6);
      tl.from("#stat-sub", { opacity: 0, y: 20, duration: 0.5, ease: "power2.out" }, 15.0);

      // Exit at 16.7
      tl.to("#flex-scene-inner", { opacity: 0, scale: 1.1, duration: 0.3, ease: "power2.in" }, 16.7);
      tl.set("#flex-scene-inner", { opacity: 0 }, 17.0);

      // -- Scene 5: Outro --
      tl.from("#logo-text", { opacity: 0, scale: 0.8, duration: 1, ease: "power4.out" }, 17.2);
      tl.from("#url-text", { opacity: 0, y: 20, duration: 0.8, ease: "power3.out" }, 17.5);
      
      // Fade to black at end
      tl.to("#outro-scene-inner", { opacity: 0, duration: 0.5 }, 19.5);
      tl.set("#outro-scene-inner", { opacity: 0 }, 20.0);
      tl.to("#bgm", { volume: 0, duration: 1 }, 19.0); // Fade out music

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
