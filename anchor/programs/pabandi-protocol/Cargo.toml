[package]
name = "pabandi-protocol"
version = "0.1.0"
description = "Pabandi Protocol — Trust, Staking, Escrow, Agents on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "pabandi_protocol"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.29.0"
anchor-spl = "0.29.0"
