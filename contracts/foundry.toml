[profile.default]
src = "."
out = "out"
libs = ["lib"]
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200
skip = ["hardhat.config.ts", "ignition", "test", "scripts", "sdk", "solana"]

[rpc_endpoints]
sepolia = "https://rpc.sepolia.org"
bsc_testnet = "https://data-seed-prebsc-1-s1.binance.org:8545"

[etherscan]
sepolia = { chain = 11155111, url = "https://api-sepolia.etherscan.io/api", key = "YOUR_API_KEY" }
