<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Service Coordinator — shell preview</title>
    <!-- Suppresses Chrome's automatic /favicon.ico request, which would
         otherwise surface as a 404 console error and fail the console-error
         assertion in the keyboard test. -->
    <link rel="icon" href="data:," />
    <!-- The two typefaces the design system mandates. Space Grotesk is already
         loaded by the app shell for index.html; this entry has no shell, so it
         loads them itself. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Bare document on purpose: no app chrome, no router, no Tailwind
         preflight. The shell is measured against a neutral page so a failing
         assertion is the shell's fault and not a global stylesheet's. */
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0a1118;
      }
      #root {
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/coordinator-shell-main.tsx"></script>
  </body>
</html>
