<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      background: var(--bg-neutral, #0f172a);
      color: var(--text-base, #ffffff);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: var(--font-mono);
    }
    .counter {
      font-size: 120px;
      font-weight: 800;
      color: #22c55e;
    }
    .label {
      font-size: 40px;
      color: #94a3b8;
      font-family: var(--font-sans);
    }
  </style>

  <div id="root" data-composition-id="04-yield" data-width="1920" data-height="1080">
    <div class="counter" id="yield">0.00%</div>
    <div class="label" id="label">Staking Yield</div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    tl.from("#label", { opacity: 0, y: 20, duration: 1 }, 0.5);
    tl.to({ val: 0 }, { val: 8.5, duration: 3, onUpdate: function() {
      const el = document.getElementById("yield");
      if (el) el.innerText = "+" + this.targets()[0].val.toFixed(2) + "%";
    } }, 1.5);
    window.__timelines["04-yield"] = tl;
  </script>
</template>
