# Pabandi + Evolution API — WhatsApp Setup
# ==========================================
#
# Evolution API is a self-hosted WhatsApp integration that uses YOUR OWN
# WhatsApp number via WhatsApp Web. No Meta business verification needed.
# No per-message fees.
#
# Quick Start:
#   1. docker-compose up -d
#     2. docker-compose logs -f evolution-api
#   3. Scan QR code with your WhatsApp number
#   4. Done — your WhatsApp is now a bot

services:
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=pabandi-evolution-key-2026
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://evolution-redis:6379/6
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_REDIS_TTL=604800
      - REDIS_ENABLED=true
      - REDIS_URI=redis://evolution-redis:6379
      - REDIS_PREFIX_KEY=evolution
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolution@postgres:5432/evolution
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - LOG_LEVEL=ERROR
      - DEL_INSTANCE=false
      - CONFIG_SESSION_CLIENT_NAME=Pabandi
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_URL=http://host.docker.internal:10000/api/v1/whatsapp/webhook
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=true
    depends_on:
      - postgres
      - evolution-redis
    networks:
      - evolution-network
    volumes:
      - evolution-data:/evolution/instances

  evolution-redis:
    image: redis:7-alpine
    container_name: evolution-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - evolution-network
    command: redis-server --appendonly yes

  postgres:
    image: postgres:15-alpine
    container_name: evolution-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=evolution
      - POSTGRES_DB=evolution
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - evolution-network

volumes:
  evolution-data:
  postgres-data:
  redis-data:

networks:
  evolution-network:
    driver: bridge
