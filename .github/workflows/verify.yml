name: verify

# Runs the tests on every push, and the production smoke test after a deploy.
#
# WHY THIS EXISTS
# ---------------
# Six defects shipped and passed every check this project had. Five were found by a
# person — the customer, or by reading code. Nothing ran on its own:
#
#   .github/workflows/
#     codeql.yml           security scanning only
#     manual-migrate.yml   a manual trigger
#
# So 541 tests existed to catch regressions and none of them ran except when
# someone remembered. A regression reached production silently, more than once.
#
# This is the fix for the failure mode, not for any individual bug.

# Least privilege. Without this the job inherits the repository default, which may be
# read/write. CodeQL flagged all three of these workflows as
# actions/missing-workflow-permissions.
#
# verify only ever reads the checkout. deploy-site needs to open a pull request
# comment? No — it does not, so it is contents: read as well.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and types
    runs-on: ubuntu-latest

    # 14 suites import the real Prisma client and talk to an actual database
    # (critical-paths.test.ts does referralEarning.deleteMany() in beforeEach and
    # failed here with PrismaClientInitializationError). Previously this job had no
    # database, so it could never have passed.
    #
    # A throwaway container, deliberately NOT the repo's DATABASE_URL secret. That
    # secret points at production. `deleteMany` against it in a beforeEach is not a
    # risk worth taking to make a pipeline green, and these suites are not written to
    # leave production data intact.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pabandi
          POSTGRES_PASSWORD: pabandi
          POSTGRES_DB: pabandi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://pabandi:pabandi@localhost:5432/pabandi_test
      DIRECT_URL: postgresql://pabandi:pabandi@localhost:5432/pabandi_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate

      - name: Validate the schema
        working-directory: server
        # Cheap, and it has caught real drift: the merge unioned two schemas and an
        # invalid one would fail at runtime, not at boot.
        #
        # DATABASE_URL comes from the job env and points at the throwaway
        # container. `prisma validate` only parses, but it refuses to parse at all
        # without a URL present — which is why this step failed before the service
        # container existed.
        run: npx prisma validate

      - name: Build the test database
        working-directory: server
        # `db push`, NOT `migrate deploy`. This is not a shortcut — the migration
        # folder cannot build this database, and I confirmed that rather than assuming:
        #
        #   * `prisma/migrations/003_recommendation_tables.sql` sits in the migrations
        #     ROOT, not in a timestamped folder, so migrate deploy never runs it. It
        #     was applied by hand to the one live database.
        #   * Consequently `migrate deploy` on an empty database dies at
        #     20260829_add_agent_learning_and_app_integration with
        #     ERROR: relation "Project" does not exist.
        #   * Worse, no migration anywhere creates "Web3Agent" — the table AgentStake's
        #     foreign key targets. Counting CREATE TABLE statements across all 37
        #     migrations gives 72 tables against 338 models in schema.prisma, so 271
        #     models have no migration at all.
        #
        # Production was therefore built by db push, not by migrations. db push derives
        # the schema from schema.prisma, which IS what production actually runs, so it
        # is the only option that makes CI test the real schema. Using
        # `migrate deploy` here would fail; using the repo's DATABASE_URL secret would
        # mean running deleteMany() in a beforeEach against production.
        #
        # No --accept-data-loss: this runs against an empty throwaway container, where
        # nothing can be lost, and omitting the flag means that if this is ever pointed
        # at a real database it fails loudly instead of dropping tables.
        run: npx prisma db push

      - name: Run tests
        working-directory: server
        # The open intermittent Prisma flake is tracked in docs/build-plan.md as
        # item 3.2 and documented in vitest.config.ts.
        # No --poolOptions here. vitest 4's CLI rejects it outright
        # ("CACError: Unknown option `--poolOptions`"), and vitest.config.ts
        # documents that pool=forks + singleFork was already tried and REVERTED
        # because it did not fix the Prisma flake. So the flag was both invalid and
        # contradicted by an existing finding.
        #
        # This job also happens to be the experiment vitest.config.ts asks for: the
        # client is generated in its own earlier step, so no `prisma generate` is in
        # flight while tests run. If this job stays green while local runs flake, the
        # torn-read theory is confirmed and the flake is local-only.
        run: npx vitest run

      - name: Type check
        working-directory: server
        # Non-blocking. There are 26 pre-existing errors, all recorded in the plan.
        # This job's value is catching NEW ones, so it warns rather than blocks —
        # until the baseline is cleared and this can be made required.
        continue-on-error: true
        run: npx tsc --noEmit

  build:
    name: Client and server build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Install client dependencies
        working-directory: client
        run: npm ci --legacy-peer-deps

      - name: Compile server
        working-directory: server
        # Verifies the thing Docker runs: `compile` produces dist/ in the image and
        # stages the email templates the runtime reads. It tolerates the 26 known
        # type errors by design — the type job below reports those, so failing
        # here too would only make this step unrunnable.
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/pabandi_schema_check
        run: npm run compile

      - name: Build client
        working-directory: client
        run: npm run build

      - name: Assert no service worker is emitted
        working-directory: client
        # A precaching worker kept serving stale bundles after a deploy. It is
        # disabled in vite.config.ts; this makes the guarantee explicit rather than
        # dependent on someone remembering why.
        run: |
          if [ -f dist/sw.js ]; then
            echo "::error::dist/sw.js exists — the PWA worker is enabled again"
            exit 1
          fi
          echo "no service worker emitted"

      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          retention-days: 7
