name: Manual Prisma Migration

# The DATABASE_URL secret points at Aliyun RDS (Singapore), NOT Supabase.
# The old name said Supabase, which was misleading when auditing this job.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "run migration" to confirm'
        required: true
        default: ''

jobs:
  migrate:
    name: Run Prisma Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install dependencies
        run: |
          cd server
          npm install

      - name: Resolve failed migration (if any)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          cd server
          # Idempotent. `migrate resolve --applied` is NOT safe to run twice: it
          # exits non-zero with P3008 when the migration is already recorded as
          # applied. Because a failed step aborts the job, this used to make the
          # entire workflow permanently unrunnable once the record existed --
          # which it now does, so `deploy` below could never be reached.
          #
          # P3008 = already applied -> nothing to do.
          # Other  -> genuinely blocked, fail loudly rather than migrate past it.
          set +e
          output=$(npx prisma migrate resolve --applied 20260902_add_current_hash 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ $status -ne 0 ] && echo "$output" | grep -q "P3008"; then
            echo "Already recorded as applied; skipping resolve."
          elif [ $status -ne 0 ]; then
            echo "::error::migrate resolve failed for a reason other than P3008"
            exit $status
          fi

      - name: Run Prisma Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          cd server
          npx prisma migrate deploy
