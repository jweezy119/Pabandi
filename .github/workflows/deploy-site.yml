name: deploy-site

# Publishes client/dist to Firebase Hosting.
#
# WHY THIS EXISTS
# ---------------
# Firebase deploys were MANUAL, and nothing in CI touched them. The site therefore
# drifted silently: for two days pabandi.com served a bundle from before several
# fixes, while the API on Render was current and /health confirmed every commit.
#
# The session where that was discovered had a false-negative at its centre. A fix
# was deployed, verified in /health, and confirmed present in the deployed Render
# bundle — and the customer still saw the bug, because they were on a different
# host entirely. Every verification was correct. All of them were about the wrong
# artifact.
#
# Two deploy targets, one repo, no automation on either. This closes the site half.

# Least privilege. Without this the job inherits the repository default, which may be
# read/write. CodeQL flagged all three of these workflows as
# actions/missing-workflow-permissions.
#
# verify only ever reads the checkout. deploy-site needs to open a pull request
# comment? No — it does not, so it is contents: read as well.
permissions:
  contents: read

on:
  # Needed because the paths filter below is correct and therefore made this workflow
  # unrunnable in exactly the case it existed to fix: the client enrollment fix was
  # pushed, its deploy failed on a bad action path, and no later commit touched
  # client/** — so the customer's bug stayed live with no way to re-publish except a
  # meaningless code change. A deploy you cannot retry is not a safety net.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # Only when the site or its deploy config changes. The API deploys to Render
      # on its own cadence; rebuilding the site for a server-only commit would
      # publish an identical bundle for no reason.
      - 'client/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-site.yml'
      - 'scripts/smoke.mjs'

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish to Firebase
    runs-on: ubuntu-latest

    # Safety: never publish from a fork. A fork can run workflow code with access
    # to secrets if it is not gated, and this one writes to production.
    if: github.repository == 'jweezy119/Pabandi'

    permissions:
      contents: read
      id-token: write # Firebase deploy uses OIDC, not a long-lived token

    env:
      FIREBASE_PROJECT: pabandi-42c5b

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install client dependencies
        working-directory: client
        run: npm ci --legacy-peer-deps

      - name: Build client
        working-directory: client
        # BUILD_SHA is compiled into the bundle as __BUILD_SHA__ and used by
        # src/utils/staleTab.ts to notice when an open tab is running an older build than
        # the server is serving. Without a real value here it is 'dev', and the detector
        # disables itself — which would silently remove the protection in production while
        # every local test still passed.
        env:
          BUILD_SHA: ${{ github.sha }}
        run: npm run build

      - name: Assert the shell references a bundle that exists
        working-directory: client
        # Guards the actual failure: the site shell named a bundle the server did
        # not have, so a customer ran a copy from their own cache and a deployed fix
        # never reached them.
        #
        # The check is REFERENCE-based, not a file count. Vite emits additional
        # index-*.js chunks for lazy routes and they are legitimately named
        # index-*; an earlier version of this step counted them and would have
        # failed every deploy over a normal build. What matters is that whatever
        # index.html points at is present in dist.
        run: |
          set -euo pipefail
          cd dist
          referenced=$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' index.html | head -1)
          if [ -z "$referenced" ]; then
            echo "::error::index.html references no bundle"
            exit 1
          fi
          echo "index.html references: $referenced"
          if [ ! -f "$referenced" ]; then
            echo "::error::$referenced is referenced but missing from dist"
            exit 1
          fi
          echo "present: $(wc -c < "$referenced" | tr -d ' ') bytes"
          echo "index-*.js chunks in dist: $(ls assets/index-*.js | wc -l | tr -d ' ') (lazily loaded, expected)"

      # Using firebase-tools directly, not a wrapper action. Two wrapper attempts have
      # now failed here: firebase-actions/setup-firebase does not exist as a repository
      # (they are marketplace actions), and w9jds/firebase-action wanted a credential
      # variable name I could not verify — the v13.6.0 tag I guessed has no action.yml
      # at that path, and mapping GCP_SA_KEY to GCP_SA_KEY_FIREBASE still failed.
      #
      # Guessing at a third-party action's input names is not worth a third attempt when
      # the documented mechanism is GOOGLE_APPLICATION_CREDENTIALS plus the firebase CLI,
      # which is stable and inspectable.
      #
      # GCP_SA_KEY is an existing repo service-account JSON secret (set 2026-05-10), so
      # this needs no new credential from you.
      - name: Write service account credentials
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "::error::secrets.GCP_SA_KEY is empty - cannot authenticate to Firebase"
            exit 1
          fi
          printf '%s' "$GCP_SA_KEY" > "$RUNNER_TEMP/firebase-sa.json"
          # Fail here, not three steps later with an opaque auth error.
          node -e "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/firebase-sa.json','utf8'))" \
            || { echo "::error::GCP_SA_KEY is not valid JSON"; exit 1; }

      - name: Deploy hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: |
          npx --yes firebase-tools@13 deploy \
            --only hosting \
            --project "$FIREBASE_PROJECT" \
            --non-interactive

      - name: Smoke test the published site
        # Runs against the artifact that was just published, not against whatever
        # happened to be live. This is the check that would have caught the two-day
        # drift the moment a commit shipped.
        run: node scripts/smoke.mjs "${{ github.sha }}"
        env:
          SMOKE_SITE_URL: https://pabandi.com
          SMOKE_API_URL: https://pabandi.onrender.com
          # This workflow's path filter only matches client-side and deploy-config
          # files, so this commit cannot have changed the API. Render deploys on its
          # own cadence, so requiring the same commitSha here only produces false
          # failures — one already failed a green deploy on a CI-only commit.
          # Every functional API check below still runs and still fails hard.
          SMOKE_API_SHA_ADVISORY: '1'

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Site deployed"
            echo ""
            echo "- commit: ${{ github.sha }}"
            echo "- site: https://pabandi.com"
            echo ""
            echo "Smoke test output above is the verification. If it fails, the site is"
            echo "serving something other than what this commit built."
          } >> "$GITHUB_STEP_SUMMARY"
